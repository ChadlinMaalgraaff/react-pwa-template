<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>What's Lekker? — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- What's Lekker design tokens ---- */
    --herb-900:#173d2f;       /* deepest green ink */
    --herb-700:#1e5645;       /* primary deep herb green */
    --herb-600:#235c47;
    --herb-500:#2c6b53;       /* button gradient top */
    --honey:#cc8a1e;          /* warm honey accent */
    --honey-soft:#e6a93f;

    --oat:#f0ede2;            /* warm oat canvas */
    --oat-deep:#e9e5d6;
    --cream:#fbfaf4;          /* card surface */
    --cream-2:#f6f3ea;        /* badge / inset surface */

    --ink:#1b2a22;           /* primary text */
    --muted:#6f756a;         /* secondary text */
    --hairline:#e3dfd1;      /* warm borders */
    --hairline-2:#ece8da;

    --radius-card:30px;
    --radius-field:16px;
    --shadow-card:0 1px 2px rgba(23,61,47,.04), 0 18px 40px -18px rgba(23,61,47,.28), 0 40px 80px -40px rgba(23,61,47,.22);
    --shadow-btn:0 1px 0 rgba(255,255,255,.18) inset, 0 8px 18px -6px rgba(30,86,69,.55);
    --ease:cubic-bezier(.2,.7,.2,1);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #f6f3e8 0%, var(--oat) 46%, var(--oat-deep) 100%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    min-height:100dvh;
  }

  /* faint botanical watermark drawn from the brand's protea */
  .field-bg{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .field-bg svg{
    position:absolute; top:-6%; left:50%; transform:translateX(-50%);
    width:min(560px,120vw); height:auto; opacity:.06; color:var(--herb-700);
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; }

  /* emblem badge that nudges over the card edge */
  .badge{
    width:104px; height:104px; margin:0 auto -52px; position:relative; z-index:3;
    border-radius:28px;
    background:linear-gradient(180deg,#ffffff 0%, var(--cream-2) 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 12px 26px -10px rgba(23,61,47,.35), 0 0 0 1px var(--hairline);
    display:grid; place-items:center;
    animation:badge-in .9s var(--ease) both;
  }
  .badge img{ width:78px; height:auto; display:block; filter:drop-shadow(0 4px 8px rgba(23,61,47,.18)); }

  .card{
    position:relative;
    background:linear-gradient(180deg,var(--cream) 0%, #f8f5ec 100%);
    border:1px solid var(--hairline-2);
    border-radius:var(--radius-card);
    padding:74px 30px 28px;
    box-shadow:var(--shadow-card);
    animation:card-in .8s var(--ease) both;
  }
  /* honey hairline accent at the very top of the card */
  .card::before{
    content:""; position:absolute; left:50%; top:-1px; transform:translateX(-50%);
    width:72px; height:3px; border-radius:3px;
    background:linear-gradient(90deg,transparent, var(--honey) 30%, var(--honey-soft) 70%, transparent);
    opacity:.85;
  }

  .head{ text-align:center; margin-bottom:26px; }
  .wordmark{
    font-family:"Fraunces",serif;
    font-weight:600; font-size:30px; line-height:1.05; letter-spacing:-.01em;
    color:var(--herb-700); margin:0;
  }
  .wordmark .q{ color:var(--honey); }
  .welcome{
    font-family:"Fraunces",serif; font-weight:500; font-size:18px;
    color:var(--ink); margin:10px 0 0;
  }
  .sub{ font-size:13.5px; color:var(--muted); margin:5px 0 0; }

  form{ display:flex; flex-direction:column; gap:16px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-size:12.5px; font-weight:600; letter-spacing:.01em;
    color:var(--herb-700);
  }
  .input{
    position:relative; display:flex; align-items:center;
    background:var(--cream-2);
    border:1.5px solid var(--hairline);
    border-radius:var(--radius-field);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
  }
  .input .icon{
    display:grid; place-items:center; width:44px; height:52px; color:var(--muted);
    flex:none;
  }
  .input input{
    flex:1; border:0; outline:0; background:transparent;
    font-family:inherit; font-size:15.5px; color:var(--ink);
    padding:14px 8px 14px 0; min-width:0;
  }
  .input input::placeholder{ color:#a7a89c; }
  .input .toggle{
    border:0; background:transparent; cursor:pointer; color:var(--muted);
    width:46px; height:52px; display:grid; place-items:center; flex:none;
    border-radius:0 var(--radius-field) var(--radius-field) 0;
  }
  .input .toggle:hover{ color:var(--herb-700); }
  .input:focus-within{
    border-color:var(--herb-600);
    background:#fff;
    box-shadow:0 0 0 4px rgba(30,86,69,.10);
  }

  .row-helper{ display:flex; justify-content:flex-end; margin-top:-4px; }
  .link{
    color:var(--herb-700); text-decoration:none; font-weight:600; font-size:13px;
    position:relative;
  }
  .link::after{
    content:""; position:absolute; left:0; right:100%; bottom:-2px; height:1.5px;
    background:var(--herb-700); transition:right .25s var(--ease);
  }
  .link:hover::after{ right:0; }

  .btn{
    margin-top:4px; border:0; cursor:pointer; width:100%;
    font-family:inherit; font-weight:600; font-size:15.5px; letter-spacing:.01em;
    color:#f4f1e6; padding:15px 16px; border-radius:var(--radius-field);
    background:linear-gradient(180deg,var(--herb-500) 0%, var(--herb-700) 100%);
    box-shadow:var(--shadow-btn);
    transition:transform .15s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.04);
    box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 12px 24px -8px rgba(30,86,69,.6); }
  .btn:active{ transform:translateY(0); filter:brightness(.98); }

  .divider{ display:flex; align-items:center; gap:14px; margin:22px 0 18px; }
  .divider::before,.divider::after{ content:""; height:1px; flex:1; background:var(--hairline); }
  .divider span{ font-size:11px; letter-spacing:.16em; color:var(--muted); font-weight:600; }

  .btn-google{
    width:100%; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:11px;
    font-family:inherit; font-weight:600; font-size:14.5px; color:var(--ink);
    background:#fff; border:1.5px solid var(--hairline);
    padding:13px 16px; border-radius:var(--radius-field);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  .btn-google:hover{ border-color:#d6d1c0; box-shadow:0 6px 16px -10px rgba(23,61,47,.4); transform:translateY(-1px); }
  .btn-google svg{ width:18px; height:18px; flex:none; }

  .foot{ text-align:center; margin:22px 0 2px; font-size:13.5px; color:var(--muted); }
  .foot .link{ font-size:13.5px; }

  :focus-visible{ outline:2px solid var(--herb-600); outline-offset:2px; border-radius:8px; }

  @keyframes card-in{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  @keyframes badge-in{ 0%{opacity:0; transform:translateY(10px) scale(.9);} 100%{opacity:1; transform:none;} }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (max-width:380px){
    .card{ padding:70px 22px 24px; }
    .wordmark{ font-size:27px; }
  }
</style>
</head>

    <div class="card">
      <div class="head">
        <h1 class="wordmark">What&rsquo;s Lekker<span class="q">?</span></h1>
        <p class="welcome">Welcome back</p>
        <p class="sub">Find the lekker in your fridge</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input">
            <span class="icon" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
            </span>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <span class="icon" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle" id="togglePw" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-helper">
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn">Log in</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button type="button" class="btn-google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.22-4.74 3.22-8.32Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38Z"/></svg>
        Continue with Google
      </button>

      <p class="foot">Don&rsquo;t have an account? <a href="#" class="link">Sign up</a></p>
    </div>
  </div>

<script>
  // password show / hide
  const pw = document.getElementById('password');
  const toggle = document.getElementById('togglePw');
  const eye = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4 4"/><path d="M9.4 5.3A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4.1M6.3 6.3A18 18 0 0 0 2 12s3.5 7 10 7a9.5 9.5 0 0 0 3.3-.6"/>';
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.innerHTML = show ? eyeOff : eyeOpen;
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn');
    btn.textContent = 'Logging in…';
    setTimeout(() => { btn.textContent = 'Log in'; }, 1400);
  });
</script>
